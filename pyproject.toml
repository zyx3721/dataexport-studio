[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataexport-studio"
version = "1.0.0"
description = "A read-only desktop database table exporter."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PySide6-Essentials>=6.5,<7",
  "SQLAlchemy>=2.0,<3",
  "greenlet>=3.0,<3.2",
  "openpyxl>=3.1,<4",
  "PyMySQL>=1.1,<2",
  "psycopg[binary]>=3.1,<4",
  "pymssql>=2.3,<3",
  "pymongo>=3.13,<4",
  "qtawesome>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "mongomock>=4.1,<5"]
build = ["pyinstaller>=6.0,<7"]

[project.scripts]
dataexport-studio = "dataexport_studio.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
